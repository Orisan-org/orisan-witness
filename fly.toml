# Fly.io configuration for the Orisan witness.
#
# ONE MACHINE, DELIBERATELY. The store is SQLite on a volume: two machines
# would mean two divergent witnesses, which is worse than none — a customer
# checking a head could get either answer. Horizontal scale needs Postgres or
# a consensus layer, and that is a v2 decision, not a config flag.

app = "orisan-witness"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  WITNESS_DB = "/data/witness.db"
  WITNESS_KEY = "/data/witness-signing.key"

[[mounts]]
  source = "witness_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero and never add a second machine: see the note above.
  auto_stop_machines = false
  min_machines_running = 1
  # auto_start is ON while auto_stop is OFF. It is a no-op while the machine is
  # up, and the recovery path if it is ever stopped by a host migration, a
  # failed deploy or a stray `fly machine stop`. With it off, a stopped witness
  # stays unreachable until a human notices — and an unreachable witness means
  # every customer's verify returns exit 2.
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
