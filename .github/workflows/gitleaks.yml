# Secret-scanning gate. A hand-run `gitleaks detect` is a review interval,
# not a gate -- this runs on every push and every pull request so a leaked
# credential cannot land without the check going red first.
#
# --log-opts="--all" is passed straight to `git log`: it is what makes the
# scan walk every ref in the repository, not just the branch that triggered
# the run. A plain `gitleaks detect` only walks the checked-out branch's
# history and would miss anything that only ever landed on another branch.
name: gitleaks

on:
  push:
  pull_request:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan (full history, all refs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fetch-depth: 0 above guarantees full history for the ref that got
      # checked out; it does not guarantee every OTHER branch is present
      # locally. --log-opts="--all" below is only as complete as the refs
      # this step actually fetches, so fetch every branch and tag explicitly
      # rather than relying on whatever actions/checkout left configured.
      - name: Fetch every branch and tag
        run: |
          git remote set-branches origin '*'
          git fetch --all --tags --prune --force

      # Pinned by exact release version AND its published SHA256 checksum --
      # not a floating tag. Bump GITLEAKS_VERSION and GITLEAKS_SHA256_LINUX_X64
      # together when upgrading (checksum from the release's *_checksums.txt).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: gitleaks detect (full history, all refs)
        run: |
          ./gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            -v \
            --exit-code 1
